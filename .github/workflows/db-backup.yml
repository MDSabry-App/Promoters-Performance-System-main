name: Daily database backup

on:
  schedule:
    # 02:00 UTC every day. GitHub cron is UTC only.
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dump the database
        env:
          # DIRECT_URL is required by prisma generate in postinstall; the script only
          # reads DATABASE_URL. Both are repository secrets and never appear in the log.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run db:backup

      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/
          # Only commit when the data actually changed, otherwise the repo gets an
          # empty commit every single day.
          if git diff --staged --quiet; then
            echo "No data changes since the last backup."
          else
            git commit -m "chore(backup): database snapshot $(date -u +%Y-%m-%d)"
            git push
          fi