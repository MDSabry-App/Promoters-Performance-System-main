<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SPS F1 — لا يوجد اتصال</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        padding: 24px; background: #0b1626; color: #e8eef7;
        font-family: "Segoe UI", Tahoma, system-ui, -apple-system, sans-serif;
      }
      .card {
        width: 100%; max-width: 420px; text-align: center;
        background: #12203a; border: 1px solid #22355a; border-radius: 20px;
        padding: 32px 24px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }
      .mark {
        width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 18px;
        background: #173b73; display: grid; place-items: center; font-weight: 800;
        font-size: 22px; color: #fff; letter-spacing: .04em;
      }
      h1 { font-size: 19px; margin: 0 0 8px; }
      p { margin: 0 0 20px; font-size: 14px; line-height: 1.7; color: #a9bad4; }
      button {
        width: 100%; padding: 14px 18px; font: inherit; font-weight: 700;
        color: #fff; background: #2563c9; border: 0; border-radius: 12px; cursor: pointer;
      }
      button:active { background: #1d4fa3; }
      .hint { margin-top: 14px; font-size: 12px; color: #7d8fab; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">SPS</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        التطبيق بيحتاج اتصال بالإنترنت لأنه بيقرأ بيانات المبيعات والأهداف من السيرفر.
        اتأكد إن الجهاز متصل بالإنترنت ثم جرّب تاني.
      </p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
      <div class="hint">SPS F1 · Promoters Performance System</div>
    </div>
  </body>
</html>
